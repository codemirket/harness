<svg xmlns="http://www.w3.org/2000/svg" id="lh-art" class="lh-artwork" data-motion="auto" viewBox="0 0 800 600" width="800" height="600" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="lh-title lh-desc">
  <title id="lh-title">A quiet arrival</title>
  <desc id="lh-desc">An ivory sailboat passes a warm stone lighthouse above a rocky headland, in calm teal water under a low apricot sun.</desc>
  <defs>
    <linearGradient id="lh-sky" x1="0" y1="0" x2="0" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8efdd"/><stop offset="1" stop-color="#e8ddc5"/>
    </linearGradient>
    <linearGradient id="lh-sea" x1="0" y1="300" x2="0" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8db5aa"/><stop offset="0.48" stop-color="#61958f"/><stop offset="1" stop-color="#315f65"/>
    </linearGradient>
    <linearGradient id="lh-tower-stone" x1="214" y1="250" x2="277" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c9cbb7"/><stop offset="0.42" stop-color="#e8dec4"/><stop offset="0.76" stop-color="#faf0d8"/><stop offset="1" stop-color="#fff4db"/>
    </linearGradient>
    <linearGradient id="lh-sail-fill" x1="-64" y1="-71" x2="8" y2="-58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4e6c9"/><stop offset="0.7" stop-color="#fff5de"/><stop offset="1" stop-color="#ddd5be"/>
    </linearGradient>
    <clipPath id="lh-canvas"><rect width="800" height="600" rx="8"/></clipPath>
  </defs>
  <style>
    /* Settled defaults stay visible without CSS animation or scripting. */
    .lh-motion-boat, .lh-motion-water, .lh-motion-pennant { transform: none; }
    .lh-motion-boat, .lh-motion-pennant { transform-box: view-box; transform-origin: 0px 0px; }
    @media (prefers-reduced-motion: no-preference) {
      #lh-art[data-motion="auto"] .lh-motion-boat { animation: lh-arrival 4800ms cubic-bezier(.32,.02,.32,1) both; }
      #lh-art[data-motion="auto"] .lh-motion-water { animation: lh-water 4800ms ease-in-out both; }
      #lh-art[data-motion="auto"] .lh-motion-pennant { animation: lh-pennant 4800ms ease-in-out both; }
      #lh-art[data-motion="auto"] .lh-motion-wake { animation: lh-wake 4800ms ease-in-out both; }
      #lh-art[data-motion="auto"] .lh-motion-glint { animation: lh-glint 4800ms ease-in-out both; }
    }
    @keyframes lh-arrival {
      0% { transform: translate(-18px, 2px) rotate(-.8deg); }
      27% { transform: translate(-12px, -2px) rotate(.65deg); }
      56% { transform: translate(-5px, 1px) rotate(-.45deg); }
      80% { transform: translate(-1px, -.5px) rotate(.15deg); }
      100% { transform: none; }
    }
    @keyframes lh-water {
      0% { transform: translateX(-6px); }
      46% { transform: translateX(3px); }
      100% { transform: none; }
    }
    @keyframes lh-pennant {
      0% { transform: skewY(-7deg) scaleX(.94); }
      26% { transform: skewY(5deg) scaleX(1); }
      54% { transform: skewY(-3deg) scaleX(.98); }
      80% { transform: skewY(1deg); }
      100% { transform: none; }
    }
    @keyframes lh-wake {
      0% { opacity: .5; }
      38% { opacity: .8; }
      100% { opacity: .65; }
    }
    @keyframes lh-glint {
      0%, 100% { opacity: .6; }
      28% { opacity: .95; }
      55% { opacity: .6; }
    }
  </style>
