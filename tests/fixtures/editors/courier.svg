<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title description">
  <title id="title">Courier — a folded paper aircraft</title>
  <desc id="description">A green paper aircraft climbs through a warm cream sky above soft clouds, with a golden sun and a curved flight trail.</desc>
  <rect id="sky" width="640" height="420" rx="28" fill="#F6F3EA"/>
  <g id="sun">
    <circle cx="560" cy="60" r="22" fill="#F0BC67"/>
    <circle cx="560" cy="60" r="34" fill="none" stroke="#E4CF9F" stroke-width="1.5"/>
  </g>
  <g id="clouds" fill="#E3E9DF">
    <path d="M44 322 C44 305 61 299 73 305 C76 283 105 279 116 301 C133 295 149 305 149 322 Z"/>
    <path d="M463 304 C463 288 479 281 492 287 C496 266 524 264 536 285 C552 280 568 289 568 304 Z"/>
  </g>
  <g id="trail" fill="#769B8B" opacity="0.65">
    <circle cx="86" cy="353" r="1.8"/><circle cx="83" cy="341" r="1.8"/>
    <circle cx="87" cy="329" r="1.8"/><circle cx="96" cy="320" r="1.8"/>
    <circle cx="108" cy="312" r="1.8"/><circle cx="121" cy="308" r="1.8"/>
    <circle cx="134" cy="308" r="1.8"/><circle cx="145" cy="313" r="1.8"/>
    <circle cx="151" cy="321" r="1.8"/><circle cx="148" cy="329" r="1.8"/>
    <circle cx="139" cy="333" r="1.8"/><circle cx="129" cy="329" r="1.8"/>
    <circle cx="124" cy="321" r="1.8"/><circle cx="127" cy="310" r="1.8"/>
    <circle cx="136" cy="299" r="1.8"/><circle cx="148" cy="289" r="1.8"/>
    <circle cx="161" cy="279" r="1.8"/><circle cx="176" cy="269" r="1.8"/>
    <circle cx="190" cy="263" r="1.8"/><circle cx="204" cy="257" r="1.8"/>
  </g>
  <g id="aircraft" stroke-linejoin="round">
    <path id="wing-top" d="M126 185 L495 102 L245 222 Z" fill="#73AB95"/>
    <path id="wing-bottom" d="M245 222 L495 102 L341 326 L289 239 Z" fill="#26766C"/>
    <path id="fold-shadow" d="M245 222 L289 239 L225 285 Z" fill="#172C3B"/>
    <path id="fold-light" d="M245 222 L495 102 L289 239" fill="none" stroke="#D5E5CD" stroke-width="2"/>
    <path id="wing-edge" d="M341 326 L495 102" fill="none" stroke="#19594F" stroke-width="2"/>
  </g>
  <g id="accents" fill="#F0BC67">
    <circle cx="180" cy="111" r="4"/>
    <circle cx="453" cy="345" r="3"/>
    <path d="M68 164 L71 171 L78 174 L71 177 L68 184 L65 177 L58 174 L65 171 Z"/>
  </g>
</svg>
