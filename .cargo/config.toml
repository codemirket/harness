# Paths resolve against this repository, not a user/global Cargo home.
# Prepare this target's pinned archive with scripts/build-sqlite.py first.
[env]
SQLITE3_LIB_DIR = { value = "target/native/sqlite/lib", relative = true, force = true }
SQLITE3_INCLUDE_DIR = { value = "target/native/sqlite/include", relative = true, force = true }
SQLITE3_STATIC = { value = "1", force = true }
SQLITE3_NO_PKG_CONFIG = { value = "1", force = true }
LIBSQLITE3_SYS_USE_PKG_CONFIG = { value = "0", force = true }
# Compile only onig_sys's pinned vendored source; never discover a host library.
RUSTONIG_SYSTEM_LIBONIG = { value = "0", force = true }
RUSTONIG_DYNAMIC_LIBONIG = { value = "0", force = true }
RUSTONIG_STATIC_LIBONIG = { value = "1", force = true }

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
