<!doctype html>

<head>

<body>

      <circle cx="230" cy="230" r="172" fill="#ecdfca"/>

        <g id="sun"><circle cx="230" cy="244" r="106" fill="url(#sun-ink)"/><circle cx="230" cy="244" r="122" fill="none" stroke="#b5653d" stroke-width=".6"/></g>
        <path d="M24 299 Q230 205 436 299 V460 H24Z" fill="#b7bea0"/>

      </g>
      <circle cx="230" cy="230" r="172" fill="none" stroke="#384435" stroke-width=".8"/>
      <path d="M17 230 H66 M394 230 H443 M230 17 V66 M230 394 V443" stroke="#756955" stroke-width=".7"/>

      <text x="230" y="12" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" letter-spacing="2" fill="#665c4d">ORIENT TOWARD POSSIBILITY</text>
      <text x="230" y="453" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" letter-spacing="2" fill="#665c4d">51° 30′ N — 00° 07′ W</text>
    </svg>
    <footer><span>OBSERVE. REFRAME. BEGIN.</span><span class="closing">A journal for a slower kind of progress <b>↗</b></span></footer>
