[package]
name = "mirket"
version = "1.0.0"
edition = "2024"
rust-version = "1.99"
description = "A local agent harness for Codex and Claude"
license = "MIT"
repository = "https://github.com/codemirket/harness"
default-run = "mirket"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
include_dir = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rmcp = { version = "=3.5.1", features = ["schemars", "transport-io", "client", "transport-child-process"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.21"
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "io-std", "process", "signal"] }
toml_edit = "0.23"
zip = { version = "6", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[[bin]]
name = "mirket"
path = "src/main.rs"

[[bin]]
name = "install-codex"
path = "setup/codex.rs"

[[bin]]
name = "install-claude"
path = "setup/claude.rs"

[[bin]]
name = "install-all"
path = "setup/all.rs"
