[package]
name = "mirket"
version = "0.0.1"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
description = "A Pi coding agent harness with scoped memory, navigation and creative tools"
publish = false

# Keep useful backtrace locations without multi-gigabyte disposable debug caches.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.test]
debug = "line-tables-only"
incremental = false

[dependencies]
fastembed = { version = "=7.5.0", default-features = false, features = ["ort-load-dynamic"] }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "load-dynamic", "api-24"] }
rusqlite = { version = "=0.41.0", default-features = false, features = ["modern_sqlite", "backup"] }
rmcp = { version = "=3.7.0", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "macros", "process", "time", "sync", "io-util", "io-std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value"] }
schemars = { version = "=1.2.3", features = ["derive"] }
clap = { version = "=4.6.7", default-features = false, features = ["std", "help", "usage", "error-context"] }
sha2 = { version = "=0.11.1", default-features = false }
# Keep SVG rendering offline and vector-only: no SVGZ, system-font discovery,
# raster-image decoders or network/resource fallback.
resvg = { version = "=0.49.0", default-features = false, features = ["text", "memmap-fonts"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Storage_FileSystem"] }

[build-dependencies]
serde_json = "=1.0.154"
sha2 = { version = "=0.11.1", default-features = false }
