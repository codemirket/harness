<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vale property editor</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <strong class="brand">VALE<span aria-hidden="true">✦</span></strong>
        <button id="theme-toggle" type="button">Switch theme</button>
      </header>
      <section class="card" aria-labelledby="page-title">
        <div class="heading">
          <div>
            <p class="eyebrow">Property editor</p>
            <h1 id="page-title">Harbor House</h1>
          </div>
          <p id="publication-state" class="state">Draft</p>
        </div>
        <div class="controls">
          <label for="locale">Content locale</label>
          <select id="locale" name="locale">
            <option value="en">English</option>
            <option value="fr">Français</option>
          </select>
          <p id="locale-context">Editing English content</p>
          <label for="property-name">Property name</label>
          <input id="property-name" name="property-name" value="Harbor House">
          <label for="description">Description</label>
          <textarea id="description" name="description" rows="4">A quiet place near the harbor.</textarea>
        </div>
        <div class="actions">
          <span id="save-status" role="status">All changes saved</span>
          <button id="save" type="button">Save changes</button>
        </div>
      </section>
    </main>
  </body>
</html>
