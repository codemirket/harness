name: Harness website
on:
  push:
    paths: ['website/**', '.github/workflows/website.yml']
  pull_request:
    paths: ['website/**', '.github/workflows/website.yml']
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: node website/scripts/build.mjs
      - run: node --test website/scripts/deploy.test.mjs
      - run: node --check website/public/app.js && node --check website/scripts/deploy.mjs
