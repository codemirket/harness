# Install as /etc/nginx/sites-available/harness.mirket.dev.conf after TLS issuance.
server {
    listen 80;
    listen [::]:80;
    server_name harness.mirket.dev;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://harness.mirket.dev$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name harness.mirket.dev;
    root /opt/harness.mirket.dev/current;
    index index.html;
    ssl_certificate /etc/letsencrypt/live/harness.mirket.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/harness.mirket.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
    error_page 404 /404.html;
    location = /404.html { internal; }
    access_log /var/log/nginx/harness.mirket.dev.access.log;
    error_log /var/log/nginx/harness.mirket.dev.error.log;
}
